redpanda:
    data_directory: /var/lib/redpanda/data
    node_id: 0
    empty_seed_starts_cluster: true
    seed_servers: []
    rpc_server:
        address: 0.0.0.0
        port: 33145
    kafka_api:
        - address: 0.0.0.0
          port: 9092
          name: internal
          authentication_method: sasl
        - address: 0.0.0.0
          port: 19092
          name: external
          authentication_method: sasl
    kafka_api_tls:
        - name: external
          key_file: /caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/cas.21do.xyz/cas.21do.xyz.key
          cert_file: /caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/cas.21do.xyz/cas.21do.xyz.crt
          enabled: true
    admin:
        - address: 0.0.0.0
          port: 9644
    advertised_rpc_api:
        address: redpanda
        port: 33145
    advertised_kafka_api:
        - address: redpanda
          port: 9092
          name: internal
        - address: cas.21do.xyz
          port: 19092
          name: external
rpk:
    admin_api:
        addresses:
            - localhost:9644
    overprovisioned: true
