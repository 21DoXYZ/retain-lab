# VPS-дев (retain-lab): Redpanda без TLS (конфиг ./redpanda-local), все порты
# наружу — только loopback, доступ через SSH-туннель. ВАЖНО: docker публикует
# порты в ОБХОД ufw, поэтому 0.0.0.0:19092 из базового файла здесь принудительно
# перебинжен на 127.0.0.1 (!override), а внешний вход в published-порты дополнительно
# закрыт правилом в цепочке DOCKER-USER (см. память/отчёт Phase 0).
#   запуск:  docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d <svc...>
services:
  # ротация docker-логов: борд и джобы пишут много - без лимита
  # json-лог растёт до заполнения диска
  saas-ops:
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  clickhouse:
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./ch_users.d:/etc/clickhouse-server/users.d:ro
      - ./ch_config.d:/etc/clickhouse-server/config.d:ro
      # ночные бэкапы (retain_backup.sh, cron 03:30): BACKUP DATABASE сюда
      - /opt/backups/clickhouse:/backups

  redpanda:
    volumes:
      - redpanda_data:/var/lib/redpanda/data
      - ./redpanda-local:/etc/redpanda
    ports: !override
      - "127.0.0.1:19092:19092"
  board:
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    ports:
      - "127.0.0.1:8050:8050"
    environment:
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      # Домен публикации + туннель для отладки — иначе браузер режет CORS
      CORS_ORIGINS: "https://${SAAS_HOST:-ra.187-77-157-6.sslip.io},http://localhost:3000,http://127.0.0.1:3000"
      # Локальный Supabase (CLI) подписывает JWT HS256 — legacy-путь api/core.py
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # Статусы каналов для /api/v1/saas/channels (ключи как у saas-ops)
      # + SAAS_HOST: URL телеграм-вебхука при подключении бота тенанта
      # + STRIPE_WEBHOOK_SECRET: только СТАТУС «вебхук настроен» на /keys
      SAAS_HOST: ${SAAS_HOST:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # AI-компоновщик офферов (/saas/questionnaire): любой из ключей
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Недельный uplift-дайджест владельцу (uplift_report.py, Пн 08:00)
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      PLATFORM_ALERT_EMAIL: ${PLATFORM_ALERT_EMAIL:-}
      # статус платформенного dry-run для /saas/campaigns (честность UI)
      SIGNALS_DRY_RUN: ${SIGNALS_DRY_RUN:-1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      UNSUB_SECRET: ${UNSUB_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      DECISION_API_KEY: ${DECISION_API_KEY:-}
      DECISION_SMS_SENDER: ${DECISION_SMS_SENDER:-}
      DECISION_VIBER_SENDER: ${DECISION_VIBER_SENDER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  ingest:
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    ports:
      - "127.0.0.1:8081:8081"
  stripe-webhook:
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      # Дефолт fail-closed: маршрут /stripe/* публичен, без webhook-секрета приём
      # отвечает 400. Для внутренних мок-прогонов: STRIPE_SIGVERIFY_OFF=1 в .env.
      STRIPE_SIGVERIFY_OFF: ${STRIPE_SIGVERIFY_OFF:-}
  # SPA в host-сети: NEXT_PUBLIC_SUPABASE_URL=127.0.0.1:54321 обязан работать и в
  # server-runtime (proxy/route handlers), и в браузере (через SSH-туннель) — в
  # bridge-сети контейнерный 127.0.0.1 указывал бы на сам контейнер.
  crm-spa:
    # next-server как PID 1 не подбирает умерших детей healthcheck'ов -
    # зомби копились тысячами и уложили хост (инцидент 2026-09-25).
    init: true
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    network_mode: host
    build:
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://${SAAS_HOST:-ra.187-77-157-6.sslip.io}/supabase
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_FLASK_API_URL: https://${SAAS_HOST:-ra.187-77-157-6.sslip.io}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://${SAAS_HOST:-ra.187-77-157-6.sslip.io}/supabase
      NEXT_PUBLIC_FLASK_API_URL: https://${SAAS_HOST:-ra.187-77-157-6.sslip.io}
      HOSTNAME: "127.0.0.1"

  # Публичный HTTPS-вход (host-network: апстримы на loopback, LE-серт автоматом).
  # Личный WhatsApp (трек C, WAHA/NOWEB): ТОЛЬКО приём и ручные ответы.
  # Автокасания сюда не маршрутизируются технически - route_message знает
  # только Cloud API. Неофициальный протокол: сессию может забанить Meta,
  # клиент подключает её с явным подтверждением риска.
  waha:
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    image: devlikeapro/waha:latest
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    # порт наружу не публикуем: борд ходит по внутренней сети
    restart: unless-stopped

  # Второй инстанс WAHA: free-версия держит ОДНУ сессию на контейнер, поэтому
  # у второго клиента (simbago) свой контейнер со своими томами и своим ключом.
  # Тенанту в secrets/tenants.json прописывается:
  #   "waha_url": "http://waha-simbago:3000",
  #   "waha_api_key": "<значение WAHA_SIMBAGO_API_KEY>"
  # - иначе он ходил бы в платформенный waha (env-фолбэк) и выбивал сессию
  # hubcontent. Порт наружу не публикуем: борд ходит по внутренней сети.
  waha-simbago:
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    image: devlikeapro/waha:latest
    environment:
      WHATSAPP_API_KEY: ${WAHA_SIMBAGO_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    volumes:
      - waha_simbago_sessions:/app/.sessions
      - waha_simbago_media:/app/.media
    restart: unless-stopped

  caddy-saas:
    image: caddy:2-alpine
    network_mode: host
    environment:
      SAAS_HOST: ${SAAS_HOST:-ra.187-77-157-6.sslip.io}
    volumes:
      - ./Caddyfile.saas:/etc/caddy/Caddyfile:ro
      - ./demo-site:/srv/ra/demo-site:ro
      - ./snippet:/srv/ra/snippet:ro
      - ./site:/srv/ra/site:ro
      - caddy_saas_data:/data
      - caddy_saas_config:/config
    restart: unless-stopped

volumes:
  caddy_saas_data:
  caddy_saas_config:
  waha_sessions:
  waha_media:
  waha_simbago_sessions:
  waha_simbago_media:
