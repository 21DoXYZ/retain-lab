# VPS-дев (retain-lab): Redpanda без TLS (конфиг ./redpanda-local), все порты
# наружу — только loopback, доступ через SSH-туннель. ВАЖНО: docker публикует
# порты в ОБХОД ufw, поэтому 0.0.0.0:19092 из базового файла здесь принудительно
# перебинжен на 127.0.0.1 (!override), а внешний вход в published-порты дополнительно
# закрыт правилом в цепочке DOCKER-USER (см. память/отчёт Phase 0).
#   запуск:  docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d <svc...>
services:
  redpanda:
    volumes:
      - redpanda_data:/var/lib/redpanda/data
      - ./redpanda-local:/etc/redpanda
    ports: !override
      - "127.0.0.1:19092:19092"
  board:
    ports:
      - "127.0.0.1:8050:8050"
    environment:
      # Домен публикации + туннель для отладки — иначе браузер режет CORS
      CORS_ORIGINS: "https://${SAAS_HOST:-ra.187-77-157-6.sslip.io},http://localhost:3000,http://127.0.0.1:3000"
      # Локальный Supabase (CLI) подписывает JWT HS256 — legacy-путь api/core.py
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # Статусы каналов для /api/v1/saas/channels (ключи как у saas-ops)
      # + SAAS_HOST: URL телеграм-вебхука при подключении бота тенанта
      # + STRIPE_WEBHOOK_SECRET: только СТАТУС «вебхук настроен» на /keys
      SAAS_HOST: ${SAAS_HOST:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # AI-компоновщик офферов (/saas/questionnaire): любой из ключей
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Недельный uplift-дайджест владельцу (uplift_report.py, Пн 08:00)
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      # статус платформенного dry-run для /saas/campaigns (честность UI)
      SIGNALS_DRY_RUN: ${SIGNALS_DRY_RUN:-1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      UNSUB_SECRET: ${UNSUB_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      DECISION_API_KEY: ${DECISION_API_KEY:-}
      DECISION_SMS_SENDER: ${DECISION_SMS_SENDER:-}
      DECISION_VIBER_SENDER: ${DECISION_VIBER_SENDER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  ingest:
    ports:
      - "127.0.0.1:8081:8081"
  stripe-webhook:
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      # Дефолт fail-closed: маршрут /stripe/* публичен, без webhook-секрета приём
      # отвечает 400. Для внутренних мок-прогонов: STRIPE_SIGVERIFY_OFF=1 в .env.
      STRIPE_SIGVERIFY_OFF: ${STRIPE_SIGVERIFY_OFF:-}
  # SPA в host-сети: NEXT_PUBLIC_SUPABASE_URL=127.0.0.1:54321 обязан работать и в
  # server-runtime (proxy/route handlers), и в браузере (через SSH-туннель) — в
  # bridge-сети контейнерный 127.0.0.1 указывал бы на сам контейнер.
  crm-spa:
    network_mode: host
    build:
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://${SAAS_HOST:-ra.187-77-157-6.sslip.io}/supabase
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_FLASK_API_URL: https://${SAAS_HOST:-ra.187-77-157-6.sslip.io}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://${SAAS_HOST:-ra.187-77-157-6.sslip.io}/supabase
      NEXT_PUBLIC_FLASK_API_URL: https://${SAAS_HOST:-ra.187-77-157-6.sslip.io}
      HOSTNAME: "127.0.0.1"

  # Публичный HTTPS-вход (host-network: апстримы на loopback, LE-серт автоматом).
  caddy-saas:
    image: caddy:2-alpine
    network_mode: host
    environment:
      SAAS_HOST: ${SAAS_HOST:-ra.187-77-157-6.sslip.io}
    volumes:
      - ./Caddyfile.saas:/etc/caddy/Caddyfile:ro
      - ./demo-site:/srv/ra/demo-site:ro
      - ./snippet:/srv/ra/snippet:ro
      - ./site:/srv/ra/site:ro
      - caddy_saas_data:/data
      - caddy_saas_config:/config
    restart: unless-stopped

volumes:
  caddy_saas_data:
  caddy_saas_config:
